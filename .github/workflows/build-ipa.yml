name: Build Mullvad Browser IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build unsigned xcarchive
        run: |
          xcodebuild -workspace MullvadBrowser.xcworkspace \
            -scheme MullvadBrowser \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/MullvadBrowser.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into .ipa
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/MullvadBrowser.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r MullvadBrowser.ipa Payload

      - name: Upload MullvadBrowser.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: MullvadBrowser-IPA
          path: ${{ runner.temp }}/MullvadBrowser.ipa
